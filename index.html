<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <!-- SEO -->
  <title>EnglishFlow — Practice English and Chat</title>

  <meta
    name="description"
    content="EnglishFlow is an online English practice and chat platform. Practice English, send messages, voice messages and video calls."
  >

  <meta
    name="keywords"
    content="EnglishFlow, learn English, practice English, English chat, English speaking practice, English conversation"
  >

  <meta
    name="author"
    content="EnglishFlow"
  >

  <meta
    name="robots"
    content="index, follow"
  >

  <!-- Canonical URL -->
  <link
    rel="canonical"
    href="https://iskandarturakhonov806-oss.github.io/My-website/"
  >

  <!-- Open Graph -->
  <meta
    property="og:title"
    content="EnglishFlow — Practice English and Chat"
  >

  <meta
    property="og:description"
    content="Practice English, chat, send voice messages and make video calls with EnglishFlow."
  >

  <meta
    property="og:type"
    content="website"
  >

  <meta
    property="og:url"
    content="https://iskandarturakhonov806-oss.github.io/My-website/"
  >

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


<header>

  <div class="logo">
    English<span>Flow</span>
  </div>

  <div>
    🟢 Chat
  </div>

</header>


<main>

  <section class="chat-card">


    <!-- CHAT HEADER -->

    <div class="chat-head">

      <div class="avatar">
        EF
      </div>

      <div>

        <h1>
          Talk with me
        </h1>

        <p>
          EnglishFlow chat
        </p>

      </div>

    </div>


    <!-- MESSAGES -->

    <div
      id="messages"
      class="messages"
    >

      <div class="message owner">

        <div class="bubble">
          Hi! 👋 Welcome to EnglishFlow.
        </div>

        <span>
          Now
        </span>

      </div>


      <div class="message owner">

        <div class="bubble">
          Send me a message and let's talk.
        </div>

        <span>
          Now
        </span>

      </div>

    </div>


    <!-- CHAT FORM -->

    <form id="chatForm">


      <!-- NAME -->

      <input
        id="nameInput"
        maxlength="30"
        placeholder="Your name"
        required
      >


      <!-- MESSAGE + BUTTONS -->

      <div class="row">


        <input
          id="messageInput"
          maxlength="500"
          placeholder="Write a message..."
        >


        <!-- MICROPHONE -->

        <button
          id="voiceButton"
          type="button"
          title="Record voice"
        >
          🎤
        </button>


        <!-- VIDEO CALL -->

        <button
          id="videoCallButton"
          type="button"
          title="Video call"
        >
          📹
        </button>


        <!-- SEND -->

        <button
          type="submit"
        >
          Send
        </button>


      </div>


    </form>


  </section>


  <p class="notice">

    Practice English, chat and improve your speaking every day.

  </p>


</main>


<!-- FOOTER -->

<footer>

  <div class="logo">
    English<span>Flow</span>
  </div>

  <p>
    Learn a little. Practice every day. 🚀
  </p>

</footer>


<!-- SUPABASE -->

<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>


<!-- OUR CHAT -->

<script src="script.js"></script>


</body>

          </html>
